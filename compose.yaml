services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connect4
      POSTGRES_USER: connect4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevonly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect4 -d connect4"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://connect4:${POSTGRES_PASSWORD:-localdevonly}@db:5432/connect4?sslmode=disable
      ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
