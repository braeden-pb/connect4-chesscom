# Local development example. Replace credentials and use managed secrets for production.
apiVersion: v1
kind: Secret
metadata:
  name: connect4-db
stringData:
  POSTGRES_PASSWORD: localdevonly
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect4-schema
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS games (
      id UUID PRIMARY KEY,
      moves JSONB NOT NULL DEFAULT '[]'::jsonb,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      CONSTRAINT moves_is_array CHECK (jsonb_typeof(moves) = 'array')
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: connect4-db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: connect4}
            - {name: POSTGRES_USER, value: connect4}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: connect4-db, key: POSTGRES_PASSWORD}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U connect4 -d connect4']
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: connect4-db-data}
        - name: schema
          configMap: {name: connect4-schema}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: connect4-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: connect4-db, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: "postgres://connect4:$(POSTGRES_PASSWORD)@db:5432/connect4?sslmode=disable"
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: connect4-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
